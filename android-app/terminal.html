<script id="bb-cache-cleanup">
(function(){
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        return Promise.all(regs.map(function(reg){return reg.unregister();}));
      }).catch(function(err){console.warn('[BIGBULLS cache cleanup] Service Worker:',err);});
    }
    if ('caches' in window) {
      caches.keys().then(function(keys){
        return Promise.all(keys.map(function(key){return caches.delete(key);}));
      }).catch(function(err){console.warn('[BIGBULLS cache cleanup] Cache Storage:',err);});
    }
  } catch(err) { console.warn('[BIGBULLS cache cleanup] unavailable:',err); }
})();
</script>
<script id="bb-terminal-runtime-diagnostics">
(function(){
  function show(kind,message,source,line,column,stack){
    try{
      var box=document.getElementById('bb-terminal-runtime-error');
      if(!box){
        box=document.createElement('section');box.id='bb-terminal-runtime-error';
        box.style.cssText='position:fixed;z-index:2147483647;inset:12px;padding:18px;overflow:auto;background:#fff;color:#7f1d1d;border:2px solid #dc2626;border-radius:14px;box-shadow:0 12px 40px #0005;font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap';
        var title=document.createElement('h2');title.textContent='BIGBULLS TERMINAL — JAVASCRIPT ERROR';title.style.cssText='font:800 16px sans-serif;margin:0 0 12px';box.appendChild(title);
        var details=document.createElement('pre');details.id='bb-terminal-runtime-error-details';details.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;margin:0';box.appendChild(details);
        (document.body||document.documentElement).appendChild(box);
      }
      var details=document.getElementById('bb-terminal-runtime-error-details');
      var text='Type: '+kind+'\nMessage: '+String(message||'Unknown error')+'\nSource: '+String(source||'(not supplied)')+'\nLine: '+String(line||'?')+'  Column: '+String(column||'?');
      if(stack)text+='\n\nStack:\n'+String(stack);
      details.textContent+=(details.textContent?'\n\n--- NEXT ERROR ---\n\n':'')+text;
    }catch(_){}
  }
  window.addEventListener('error',function(e){show('window.error',e.message,e.filename,e.lineno,e.colno,e.error&&e.error.stack);},true);
  window.addEventListener('unhandledrejection',function(e){var r=e.reason;show('unhandledrejection',r&&r.message||r,'',0,0,r&&r.stack);});
})();
</script>

    // Historical candles are loaded from the live market-data service; never synthesize candles in the client.
    function initCandles() {

    // ==========================================
    // 2. HELPERS & CALCULATIONS
    // ==========================================
    function getActiveAccount() {
      return state.accounts.find(a => a.id === state.activeAccountId) || state.accounts[0];
    }

    function formatMoney(num) {
      return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function calculateOrderPL(order) {
      // Mark Demo and Real positions against the latest live bid/ask on every market tick.
      // Backend unrealized P/L remains the fallback until a usable live quote is available.
      const inst = state.instruments[order.symbol];
      if (!inst) return Number(order.floatingPL||0);
      const currentPrice = order.side === 'Buy' ? inst.bid : inst.ask;
      if(!(currentPrice>0))return Number(order.floatingPL||0);
      const diff = order.side === 'Buy' ? (currentPrice - order.openPrice) : (order.openPrice - currentPrice);
      let pl = diff * order.lots * Number(inst.contractSize||1);
      if(['USD/JPY','USD/CAD','USD/CHF'].includes(order.symbol))pl/=currentPrice;
      else if(order.symbol.endsWith('JPY')){const fx=state.instruments['USD/JPY'];const rate=fx?(Number(fx.bid)+Number(fx.ask))/2:0;if(rate>0)pl/=rate;else return Number(order.floatingPL||0);}
      else if(order.symbol==='EUR/GBP'){const fx=state.instruments['GBP/USD'];const rate=fx?(Number(fx.bid)+Number(fx.ask))/2:0;if(rate>0)pl*=rate;else return Number(order.floatingPL||0);}
      return Number(pl.toFixed(2));
    }

    function getAccountMetrics() {
      const acc = getActiveAccount();
      const accountOpenOrders = state.openOrders.filter(o => o.accountId === acc.id);
      if(String(acc?.type||'').toLowerCase()==='demo'&&window.__bbPaperMetrics){
        const pm=window.__bbPaperMetrics,balance=Number(pm.balance||0);
        const floatingPL=accountOpenOrders.reduce((sum,o)=>sum+calculateOrderPL(o),0);
        const usedMargin=Number(pm.margin||0),equity=balance+floatingPL;
        const freeMargin=Math.max(0,equity-usedMargin),marginLevel=usedMargin>0?equity/usedMargin*100:0;
        return {balance,equity,floatingPL,usedMargin,freeMargin,marginLevel,
          openCount:accountOpenOrders.length,pendingCount:state.pendingOrders.filter(o=>o.accountId===acc.id).length};
      }
      if(String(acc?.type||'').toLowerCase()==='real'&&window.__bbBbookMetrics){
        const bm=window.__bbBbookMetrics,balance=Number(bm.balance||0),creditBonus=Number(bm.credit_bonus||0);
        const floatingPL=accountOpenOrders.reduce((sum,o)=>sum+calculateOrderPL(o),0);
        const usedMargin=Number(bm.margin||0),equity=Number.isFinite(Number(bm.equity))?Number(bm.equity):balance+creditBonus+floatingPL;
        const freeMargin=Math.max(0,equity-usedMargin),marginLevel=usedMargin>0?equity/usedMargin*100:0;
        return {balance,creditBonus,equity,floatingPL,usedMargin,freeMargin,marginLevel,
          openCount:accountOpenOrders.length,pendingCount:state.pendingOrders.filter(o=>o.accountId===acc.id).length};
      }
      let floatingPL = 0;
      let usedMargin = 0;

      accountOpenOrders.forEach(o => {
        floatingPL += calculateOrderPL(o);
        const inst = state.instruments[o.symbol];
        const lev = parseInt(acc.leverage.split(':')[1]) || 2000;
        usedMargin += (o.lots * inst.contractSize * o.openPrice) / lev;
      });

      const equity = acc.balance + floatingPL;
      const freeMargin = Math.max(0, equity - usedMargin);
      const marginLevel = usedMargin > 0 ? (equity / usedMargin) * 100 : 0;

      return {
        balance: acc.balance,
        equity,
        floatingPL,
        usedMargin,
        freeMargin,
        marginLevel,
        openCount: accountOpenOrders.length,
        pendingCount: state.pendingOrders.filter(o => o.accountId === acc.id).length
      };
    }

    function showToast(title, subtitle = '', type = 'info') {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      const iconColor = type === 'success' ? 'text-bullGreen' : type === 'error' ? 'text-bullRed' : 'text-bullYellow';
      const iconSvg = type === 'success'
        ? `<svg class="w-5 h-5 ${iconColor} shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`
        : type === 'error'
        ? `<svg class="w-5 h-5 ${iconColor} shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
        : `<svg class="w-5 h-5 ${iconColor} shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;

      el.className = 'bg-[#1F2532] border border-[#323B4E] rounded-2xl p-3.5 shadow-2xl flex items-start gap-3 pointer-events-auto transition-all duration-300';
      el.innerHTML = `
        ${iconSvg}
        <div class="flex-1 min-w-0">
          <div class="text-xs font-bold text-white">${title}</div>
          ${subtitle ? `<div class="text-[11px] text-gray-300 mt-0.5 truncate">${subtitle}</div>` : ''}
        </div>
      `;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-10px)';
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    // Live quotes and candles are supplied only by the authenticated market-data / BiQuote feeds.
    function updateLiveDOMElements() {
      const metrics = getAccountMetrics();
      const acc = getActiveAccount();

      // Update live equity/balance displays
      document.querySelectorAll('[data-live-equity]').forEach(el => {
        el.textContent = `${formatMoney(metrics.equity)} USD`;
      });
      document.querySelectorAll('[data-live-balance]').forEach(el => {
        el.textContent = `${formatMoney(metrics.balance)} USD`;
      });
      document.querySelectorAll('[data-live-credit]').forEach(el => {
        el.textContent = `+${formatMoney(metrics.creditBonus||0)} USD`;
      });
      document.querySelectorAll('[data-live-pl]').forEach(el => {
        const sign = metrics.floatingPL >= 0 ? '+' : '';
        el.textContent = `${sign}${formatMoney(metrics.floatingPL)} USD`;
        el.className = metrics.floatingPL >= 0 ? 'text-bullGreen font-mono font-semibold' : 'text-bullRed font-mono font-semibold';
      });

      // Update individual instrument prices
      Object.values(state.instruments).forEach(inst => {
        document.querySelectorAll(`[data-bid="${inst.symbol}"]`).forEach(el => {
          el.textContent = inst.bid.toFixed(inst.digits);
        });
        document.querySelectorAll(`[data-ask="${inst.symbol}"]`).forEach(el => {
          el.textContent = inst.ask.toFixed(inst.digits);
        });
      });

      // Update Desktop Bottom Account Metrics Bar (Equity, Free Margin, Balance, Margin)
      document.querySelectorAll('[data-metric-equity]').forEach(el => {
        el.textContent = `${formatMoney(metrics.equity)} USD`;
      });
      document.querySelectorAll('[data-metric-freemargin]').forEach(el => {
        el.textContent = `${formatMoney(metrics.freeMargin)} USD`;
      });
      document.querySelectorAll('[data-metric-balance]').forEach(el => {
        el.textContent = `${formatMoney(metrics.balance)} USD`;
      });
      document.querySelectorAll('[data-metric-margin]').forEach(el => {
        el.textContent = `${formatMoney(metrics.usedMargin)} USD`;
      });
      document.querySelectorAll('[data-metric-margin-level]').forEach(el => {
        el.textContent = metrics.usedMargin>0 ? Number(metrics.marginLevel||0).toFixed(1)+'%' : '—';
      });
      document.querySelectorAll('[data-margin-level-bar]').forEach(el => {
        const level=Number(metrics.marginLevel||0),active=metrics.usedMargin>0;
        el.style.width=active?Math.max(0,Math.min(100,level/500*100))+'%':'0%';
        el.style.backgroundColor=level<=100?'#ef4444':level<=200?'#eab308':'#16a34a';
      });

      // Update individual open trade P/L rows
      state.openOrders.forEach(o => {
        const pl = calculateOrderPL(o);
        const inst = state.instruments[o.symbol];
        const curr = o.side === 'Buy' ? inst.bid : inst.ask;
        document.querySelectorAll(`[data-order-pl="${o.id}"]`).forEach(el => {
          el.textContent = `${pl >= 0 ? '+' : ''}${formatMoney(pl)} USD`;
          el.className = pl >= 0 ? 'text-bullGreen font-mono font-bold text-sm' : 'text-bullRed font-mono font-bold text-sm';
        });
        document.querySelectorAll(`[data-order-pill-pl="${o.id}"]`).forEach(el => {
          el.textContent = `${pl >= 0 ? '+' : ''}${formatMoney(pl)} USD`;
          el.className = pl >= 0 ? 'text-bullGreen font-mono font-semibold text-xs' : 'text-bullRed font-mono font-semibold text-xs';
        });
        document.querySelectorAll(`[data-order-curr="${o.id}"]`).forEach(el => {
          el.textContent = curr.toFixed(inst.digits);
        });
      });

      // Redraw canvas chart if visible
      drawChartCanvas();
    }

    function switchTab(tab) {
      state.activeTab = tab;
      if (tab === 'trade' && state.viewportMode === 'mobile') {

    // Symbol classifier used by the order ticket; prefer instrument metadata over name heuristics.
    function bbIsCryptoSymbol(symbol) {
      const key = String(symbol || '').trim().toUpperCase().replace(/\s+/g, '');
      if (!key) return false;
      const instrument = state && state.instruments ? state.instruments[symbol] : null;
      if (instrument && instrument.category) return String(instrument.category).toLowerCase() === 'crypto';
      const cryptoSymbols = new Set(['BTC','BTCUSD','BTC/USD','BTCUSDT','ETH','ETHUSD','ETH/USD','ETHUSDT','SOL','SOLUSD','SOL/USD','SOLUSDT','XRP','XRPUSD','XRP/USD','XRPUSDT','BNB','BNBUSD','BNB/USD','BNBUSDT']);
      return cryptoSymbols.has(key);
    }
    window.bbIsCryptoSymbol = bbIsCryptoSymbol;

    function bbUpdateTicketMargin(){
      const inst=state.instruments[state.selectedSymbol],acc=getActiveAccount(),m=state.orderTicket;
      const lev=Math.max(1,parseInt(String(acc?.leverage||'1:100').split(':')[1],10)||100);
      const price=m.mode==='Market'?(m.side==='Buy'?Number(inst?.ask):Number(inst?.bid)):Number(m.targetPrice);
      const valid=Number.isFinite(price)&&price>0;
      const required=valid?(Number(m.lots||0)*Number(inst?.contractSize||1)*price)/lev:0;
      document.querySelectorAll('[data-ticket-required-margin]').forEach(el=>{el.textContent=valid?formatMoney(required)+' USD':'Waiting for live quote';});
      const free=getAccountMetrics().freeMargin;
      document.querySelectorAll('[data-ticket-free-margin]').forEach(el=>{el.textContent=formatMoney(free)+' USD';});
      return required;
    }
    window.bbUpdateTicketMargin=bbUpdateTicketMargin;

                <input type="number" step="0.01" min="0.01" value="${m.lots}" oninput="state.orderTicket.lots=Math.max(0.01, parseFloat(this.value)||0.01);bbUpdateTicketMargin()" class="flex-1 bg-[#f8fafc] border border-[#e2e8f0] rounded-xl h-10 text-center font-mono font-bold text-sm text-white" />

    function submitOrderExecution() {
      const acc = getActiveAccount();
      const m = state.orderTicket;
      const inst = state.instruments[state.selectedSymbol];
      const execPrice = m.mode === 'Market' ? (m.side === 'Buy' ? inst.ask : inst.bid) : parseFloat(m.targetPrice);
      const lev = parseInt(acc.leverage.split(':')[1]) || 2000;

    // Local chart-renderer scheduler: this scope owns drawChartCanvas and gesture handlers.
    let chartPaintFramePending=false;
    function queueChartPaint(){
      if(chartPaintFramePending)return;
      chartPaintFramePending=true;
      const paint=()=>{
        chartPaintFramePending=false;
        try{drawChartCanvas();}
        catch(error){console.error('[BIGBULLS chart] Canvas repaint failed:',error);}
      };
      if(typeof window.requestAnimationFrame==='function')window.requestAnimationFrame(paint);
      else window.setTimeout(paint,16);
    }
    window.queueChartPaint = queueChartPaint;
    let chartView={count:90,offset:0,priceShift:0};
    const chartPointers=new Map();
    let chartGesture=null;
    function bindChartGestures(canvas){
      if(canvas.dataset.gesturesBound==='1')return;
      canvas.dataset.gesturesBound='1';
      canvas.style.touchAction='none';
      canvas.addEventListener('pointerdown',e=>{
        canvas.setPointerCapture?.(e.pointerId);
        chartPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(chartPointers.size===1)chartGesture={mode:'pan',x:e.clientX,y:e.clientY,offset:chartView.offset,shift:chartView.priceShift};
        else if(chartPointers.size===2){
          const p=[...chartPointers.values()],dx=p[0].x-p[1].x,dy=p[0].y-p[1].y;
          chartGesture={mode:'pinch',distance:Math.hypot(dx,dy),count:chartView.count,midY:(p[0].y+p[1].y)/2};
        }
      });
      canvas.addEventListener('pointermove',e=>{
        if(!chartPointers.has(e.pointerId))return;
        chartPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
        const rect=canvas.getBoundingClientRect();
        if(chartPointers.size>=2&&chartGesture?.mode==='pinch'){
          const p=[...chartPointers.values()],dx=p[0].x-p[1].x,dy=p[0].y-p[1].y,d=Math.max(1,Math.hypot(dx,dy));
          chartView.count=Math.max(18,Math.min(500,Math.round(chartGesture.count*chartGesture.distance/d)));
          chartView.offset=Math.min(Math.max(0,state.instruments[state.selectedSymbol].candles.length-chartView.count),chartView.offset);
          queueChartPaint();
        }else if(chartPointers.size===1&&chartGesture?.mode==='pan'){
          const barsPerPx=chartView.count/Math.max(100,rect.width-70);
          const dx=e.clientX-chartGesture.x,dy=e.clientY-chartGesture.y;
          chartView.offset=Math.max(0,Math.min(Math.max(0,state.instruments[state.selectedSymbol].candles.length-chartView.count),Math.round(chartGesture.offset+dx*barsPerPx)));
          chartView.priceShift=chartGesture.shift+dy/Math.max(1,rect.height);
          queueChartPaint();
        }
      });
      const finish=e=>{chartPointers.delete(e.pointerId);if(chartPointers.size===0)chartGesture=null;else if(chartPointers.size===1){const p=[...chartPointers.values()][0];chartGesture={mode:'pan',x:p.x,y:p.y,offset:chartView.offset,shift:chartView.priceShift};}};
      canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);canvas.addEventListener('lostpointercapture',finish);
      canvas.addEventListener('wheel',e=>{
        e.preventDefault();const factor=e.deltaY>0?1.18:0.85;
        chartView.count=Math.max(18,Math.min(500,Math.round(chartView.count*factor)));
        chartView.offset=Math.min(Math.max(0,state.instruments[state.selectedSymbol].candles.length-chartView.count),chartView.offset);
        queueChartPaint();
      },{passive:false});
      canvas.addEventListener('dblclick',()=>{chartView={count:90,offset:0,priceShift:0};queueChartPaint();});
    }
    function drawChartCanvas() {
      const canvas=document.getElementById('liveChartCanvas');if(!canvas)return;
      const rect=canvas.parentElement.getBoundingClientRect();if(rect.width<=0||rect.height<=0)return;
      bindChartGestures(canvas);
      const dpr=window.devicePixelRatio||1;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);
      const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
      const w=rect.width,h=rect.height,chartW=Math.max(40,w-72),inst=state.instruments[state.selectedSymbol];
      ctx.fillStyle='#0E1117';ctx.fillRect(0,0,w,h);
      ctx.strokeStyle='#191F2C';ctx.lineWidth=1;
      for(let i=1;i<7;i++){const y=h*i/7;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(chartW,y);ctx.stroke();}
      for(let i=1;i<9;i++){const x=chartW*i/9;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
      const all=inst?.candles||[];if(!all.length)return;
      const count=Math.max(18,Math.min(all.length,chartView.count));
      const end=Math.max(1,all.length-Math.max(0,chartView.offset)),start=Math.max(0,end-count),candles=all.slice(start,end);
      const open=state.openOrders.filter(o=>o.accountId===getActiveAccount()?.id&&o.symbol===state.selectedSymbol);
      const pending=state.pendingOrders.filter(o=>o.accountId===getActiveAccount()?.id&&o.symbol===state.selectedSymbol);
      const levels=[];
      open.forEach(o=>{levels.push({price:o.openPrice,color:'#60A5FA',dash:[],label:(o.side==='Buy'?'BUY':'SELL')+' '+o.lots.toFixed(2)+' @ '+Number(o.openPrice).toFixed(inst.digits)});if(Number(o.sl)>0)levels.push({price:Number(o.sl),color:'#FF4D4D',dash:[6,4],label:'SL '+Number(o.sl).toFixed(inst.digits)});if(Number(o.tp)>0)levels.push({price:Number(o.tp),color:'#00C076',dash:[6,4],label:'TP '+Number(o.tp).toFixed(inst.digits)});});
      pending.forEach(o=>{levels.push({price:o.targetPrice,color:'#F59E0B',dash:[3,3],label:'PENDING '+o.pendingType+' @ '+Number(o.targetPrice).toFixed(inst.digits)});if(Number(o.sl)>0)levels.push({price:Number(o.sl),color:'#FF4D4D',dash:[6,4],label:'SL '+Number(o.sl).toFixed(inst.digits)});if(Number(o.tp)>0)levels.push({price:Number(o.tp),color:'#00C076',dash:[6,4],label:'TP '+Number(o.tp).toFixed(inst.digits)});});
      let minP=Math.min(...candles.map(c=>Number(c.low))),maxP=Math.max(...candles.map(c=>Number(c.high)));
      levels.forEach(v=>{minP=Math.min(minP,v.price);maxP=Math.max(maxP,v.price);});
      if(inst.bid>0){minP=Math.min(minP,inst.bid);maxP=Math.max(maxP,inst.bid);}
      let range=Math.max(maxP-minP,Math.abs(maxP)*0.00001,0.00001),pad=range*.08;
      minP-=pad;maxP+=pad;const baseMin=minP,baseMax=maxP;
      minP-=range*chartView.priceShift;maxP-=range*chartView.priceShift;
      const priceToY=p=>h-((p-minP)/(maxP-minP))*h;
      const stepX=chartW/candles.length,bodyW=Math.max(1.5,Math.min(12,stepX*.68));
      candles.forEach((c,i)=>{
        const x=i*stepX+stepX/2,bull=c.close>=c.open,color=bull?'#2979FF':'#FF4D4D';
        ctx.strokeStyle=color;ctx.lineWidth=Math.max(1,Math.min(1.5,stepX*.16));ctx.beginPath();ctx.moveTo(x,priceToY(c.high));ctx.lineTo(x,priceToY(c.low));ctx.stroke();
        const y1=priceToY(c.open),y2=priceToY(c.close),top=Math.min(y1,y2),bh=Math.max(1,Math.abs(y2-y1));
        ctx.fillStyle=color;ctx.fillRect(x-bodyW/2,top,bodyW,bh);
      });
      function drawLevel(level){
        const y=priceToY(level.price);if(y<0||y>h)return;
        ctx.save();ctx.setLineDash(level.dash);ctx.strokeStyle=level.color;ctx.lineWidth=1.25;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(chartW,y);ctx.stroke();ctx.setLineDash([]);
        ctx.font='10px JetBrains Mono,monospace';const label=level.label.slice(0,34);ctx.fillStyle=level.color;ctx.fillText(label,5,Math.max(11,Math.min(h-4,y-4)));ctx.restore();
      }
      levels.forEach(drawLevel);
      if(inst.bid>0){const y=priceToY(inst.bid);ctx.save();ctx.setLineDash([3,3]);ctx.strokeStyle='#F87171';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(chartW,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#F87171';ctx.fillRect(chartW,y-9,70,18);ctx.fillStyle='#fff';ctx.font='bold 10px JetBrains Mono,monospace';ctx.fillText(inst.bid.toFixed(inst.digits),chartW+3,y+3);ctx.restore();}
      ctx.fillStyle='#8B95A7';ctx.font='10px JetBrains Mono,monospace';
      for(let i=0;i<=6;i++){const p=maxP-(maxP-minP)*i/6;ctx.fillText(p.toFixed(inst.digits),chartW+3,h*i/6+3);}
    }

    // Initial render & resize handler
    function setDesktopChartPreset(preset) {
      if (preset === 'compact') state.bottomPanelHeight = 320;
      else if (preset === 'expanded') state.bottomPanelHeight = 82;
      else state.bottomPanelHeight = 185;
      renderApp();
    }

    function startDesktopChartResize(e) {
      e.preventDefault();
      const startY = e.touches ? e.touches[0].clientY : e.clientY;
      const startHeight = state.bottomPanelHeight;
      const maxH = Math.max(260, window.innerHeight - 230);

      const onMove = (moveEvent) => {
        const currentY = moveEvent.touches ? moveEvent.touches[0].clientY : moveEvent.clientY;
        const deltaY = startY - currentY;
        const nextHeight = Math.min(maxH, Math.max(76, startHeight + deltaY));
        state.bottomPanelHeight = nextHeight;
        const panel = document.getElementById('desktopBottomPanel');
        if (panel) panel.style.height = `${nextHeight}px`;
        drawChartCanvas();
      };

      const onEnd = () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onEnd);
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onEnd);
        renderApp();
      };

      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd);
    }

    let lastResponsiveMode = 'mobile';
    function syncResponsiveLayout() {
      const nextMode = 'mobile';
      if (nextMode !== lastResponsiveMode) {
        lastResponsiveMode = nextMode;
        state.viewportMode = nextMode;
        renderApp();
      } else {
        drawChartCanvas();
      }
    }
    window.addEventListener('resize', syncResponsiveLayout, { passive: true });
    window.addEventListener('orientationchange', syncResponsiveLayout, { passive: true });

    window.onload = function() {};
  </script>

   restored=refreshed.data?.session||null;
  }
  if(!restored?.access_token||!restored.user?.id)throw new Error('No valid signed-in Supabase session is available yet.');
  session=restored;
  window.__bbTerminalAuthSession=restored;
  if(c.realtime?.setAuth){try{await c.realtime.setAuth(restored.access_token);}catch(realtimeError){console.warn('Realtime JWT bind deferred; authenticated REST recovery continues:',realtimeError.message);}}
  await accounts();
  const active=getActiveAccount();
  if(!active?.backendId||active.status!=='approved')throw new Error('Signed-in session restored, but no approved trading account is available.');
  ready=true;
  stopLocalSimulation();
  renderApp();
  const loaded=await refresh(true);
  if(!loaded)throw new Error('Account ledger did not return a verified balance and positions yet.');
  document.getElementById('bb-session-reconnect-fallback')?.remove();
  if(bbReconnectTimer){clearTimeout(bbReconnectTimer);bbReconnectTimer=null;}
  bbReconnectAttempt=0;
  await startBbookRealtime(c).catch(e=>console.warn('Realtime reconnect deferred; REST refresh remains active:',e));
  startBiQuoteRealtime().catch(e=>console.warn('BiQuote reconnect:',e));
  bbStartBackgroundLoops(c);
  console.info('BIGBULLS secure terminal session restored via',source);
  return true;
 }catch(e){
  console.warn('BIGBULLS session reconnect attempt failed:',e.message||e);
  const banner=document.getElementById('bb-session-reconnect-fallback');
  const label=banner?.querySelector('span');
  if(label)label.textContent='Secure session is still reconnecting. Account data and trading remain locked until Supabase confirms your session. '+(e.message||'');
  if(button){button.disabled=false;button.textContent='Retry session';}
  return false;
 }finally{bbReconnectBusy=false;}
}
function bbScheduleSessionReconnect(){
 if(bbReconnectTimer)return;
 const delay=Math.min(15000,2000*Math.pow(1.6,Math.min(bbReconnectAttempt++,5)));
 bbReconnectTimer=setTimeout(async()=>{
  bbReconnectTimer=null;
  const ok=await bbAttemptSessionReconnect('automatic retry');
  if(!ok)bbScheduleSessionReconnect();
 },delay);
}
function bbShowBootFallback(error){
 document.documentElement.classList.remove('bb-auth-pending');
 const uid=(window.__bbTerminalAuthSession||window.__bbParentAuthSession)?.user?.id||session?.user?.id;
 const cached=bbPrimeCachedAccounts(uid);
 if(!cached&&!state.accounts.some(a=>a.backendId)){
  state.accounts=[{id:'474909030',accountNumber:'474909030',backendId:null,nickname:'BigBulls Demo',type:'Demo',platform:'BIGBULLS',accountClass:'Standard',balance:0,equity:0,floatingPL:0,leverage:'1:100',server:'BIGBULLS',archived:false,status:'unavailable',currency:'USD'}];
  state.activeAccountId='474909030';lastAccount='474909030';
 }
 ready=true;startLocalSimulation();
 try{renderApp();}catch(renderError){console.error('Terminal fallback render:',renderError);}
 console.info('BIGBULLS terminal rendered without a blocking connection notice.');
 try{
  const c=client();
  if(!window.__bbTerminalFallbackAuthListener){
   window.__bbTerminalFallbackAuthListener=true;
   c.auth.onAuthStateChange(async(_event,s)=>{
    if(!s?.user)return;
    session=s;window.__bbTerminalAuthSession=s;
    try{if(s.access_token&&c.realtime?.setAuth)await c.realtime.setAuth(s.access_token);await accounts();renderApp();await refresh(true);startBbookRealtime(c).catch(e=>console.warn('Realtime startup:',e));startBiQuoteRealtime().catch(e=>console.warn('BiQuote startup:',e));bbStartBackgroundLoops(c);}
    catch(e){console.warn('Background account hydration:',e.message);}
   });
  }
 }catch(listenerError){console.warn('Terminal auth listener unavailable:',listenerError);}
 bbScheduleSessionReconnect();
}
function bbShowAccountFallback(){
 document.getElementById('bb-account-hydration-fallback')?.remove();
}
window.bbAiAutoTradeEnabled=false;

window.bbLoadAiAutoTradeSetting=async function(){
 try{
  const acc=getActiveAccount();

  if(!acc?.backendId||acc.type!=='Real'||acc.status!=='approved'){window.bbAiAutoTradeEnabled=false;window.bbAiAutoTradeAccountId=null;return;}

window.bbToggleAiAutoTrade=async function(accountId){
 if(!accountId||window.bbAiAutoTradeBusy)return;
 const acc=getActiveAccount();if(!acc?.backendId||acc.backendId!==accountId||acc.type!=='Real'||acc.status!=='approved'){showToast('AI Auto-Trade unavailable','Select an approved Real account.','error');return;}
 window.bbAiAutoTradeBusy=true;renderApp();
 try{

 }catch(e){showToast('Could not update AI Auto-Trade',e.message||'Please retry.','error');}
 finally{window.bbAiAutoTradeBusy=false;renderApp();}
};
function bbStartBackgroundLoops(c){
 if(backgroundLoopsStarted)return;backgroundLoopsStarted=true;
 const hydrateFromServer=async(source)=>{
  if(document.hidden||!session?.user||!ready||busy)return;

  if(!current)return;

  catch(e){console.warn('Foreground ledger rehydration deferred:',e.message||e);}
 };
 window.addEventListener('focus',()=>{void hydrateFromServer('terminal focus');});
 window.addEventListener('pageshow',()=>{void hydrateFromServer('pageshow');});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)void hydrateFromServer('visibility restore');});
 setInterval(()=>{if(!document.hidden&&(!biQuoteConnection||!window.signalR||biQuoteConnection.state!==window.signalR.HubConnectionState.Connected))quotes().catch(e=>console.warn('Quote refresh:',e));},15000);
 setInterval(async()=>{if(document.hidden)return;try{const current=getActiveAccount()?.backendId||null;await accounts(current);renderApp();await refresh(true);await window.bbLoadAiAutoTradeSetting();}catch(e){console.warn('Account balance refresh:',e);}},10000);
}
async function start(){
 if(startupPromise)return startupPromise;
 // Paint a safe, non-trading terminal shell synchronously. Auth, RPC and account
 // hydration must never be prerequisites for the chart/layout to become visible.
 try{
  if(!ready){
   const bootUid=(window.__bbTerminalAuthSession||window.__bbParentAuthSession)?.user?.id||session?.user?.id;
   if(!bbPrimeCachedAccounts(bootUid)){state.accounts=[{id:'474909030',accountNumber:'474909030',backendId:null,nickname:'BigBulls Demo',type:'Demo',platform:'BIGBULLS',accountClass:'Standard',balance:0,creditBonus:0,equity:0,floatingPL:0,leverage:'1:100',server:'BIGBULLS',archived:false,status:'unavailable',currency:'USD'}];state.activeAccountId='474909030';lastAccount='474909030';}
   ready=true;
   document.documentElement.classList.remove('bb-auth-pending');
   renderApp();
   startLocalSimulation();
  }
 }catch(paintError){console.error('Immediate terminal shell render:',paintError);}
 startupPromise=(async()=>{
  const deadline=Date.now()+BB_BOOT_TIMEOUT_MS;
  try{
   const c=client();
   // Parent portal has already authenticated before it can launch this iframe.
   // Use that session immediately; direct terminal URL visits still hydrate Supabase normally.
   const bridgedSession=window.__bbTerminalAuthSession||window.__bbParentAuthSession||null;
   // Always ask the shared Supabase SDK for its current session first so expired tokens refresh;
   // the parent snapshot is only a fallback, never the authority over SDK storage.
   const auth=await bbWithBootTimeout(c.auth.getSession(),'Session hydration',Math.max(250,deadline-Date.now()));
   if(auth.error)throw auth.error;
   session=auth.data?.session||bridgedSession||null;
   if(!session?.user){bbShowBootFallback(new Error('Secure session is not ready. Terminal remains open in safe mode; sign in to enable account access and trading.'));return;}
   // Paint the authenticated terminal shell immediately; account lookup is background-only.
   if(!bbPrimeCachedAccounts(session.user.id)){state.accounts=[{id:'474909030',accountNumber:'474909030',backendId:null,nickname:'BigBulls Demo',type:'Demo',platform:'BIGBULLS',accountClass:'Standard',balance:0,creditBonus:0,equity:0,floatingPL:0,leverage:'1:100',server:'BIGBULLS',archived:false,status:'unavailable',currency:'USD'}];state.activeAccountId='474909030';lastAccount='474909030';}
   Object.values(state.instruments).forEach(i=>{i.candles=[];i.bid=0;i.ask=0;});
   // Preserve the last confirmed UI snapshot until the authenticated server ledger rehydrates it.
   ready=true;document.documentElement.classList.remove('bb-auth-pending');
   lastMarket=state.selectedSymbol+':'+state.timeframe;renderApp();
   startBbookRealtime(c).catch(e=>console.warn('BIGBULLS Realtime startup fallback:',e));startBiQuoteRealtime().catch(e=>console.warn('BiQuote startup:',e));
   Promise.resolve().then(()=>{if(typeof loadBiQuoteCatalog==='function')return loadBiQuoteCatalog();}).catch(e=>console.warn('Instrument catalog:',e));
   Promise.resolve().then(()=>{if(typeof bbLoadMarketHolidays==='function')return bbLoadMarketHolidays();}).catch(e=>console.warn('Market holiday calendar:',e));
   Promise.resolve().then(()=>quotes()).catch(e=>console.warn('Initial quotes:',e));
   Promise.resolve().then(()=>candles()).catch(e=>notify('Market feed unavailable',e.message||'Provider candles could not be loaded.','error'));
   Promise.resolve().then(async()=>{
    try{await bbWithBootTimeout(accounts(),'Trading account hydration',BB_BOOT_TIMEOUT_MS);renderApp();await refresh(true);document.getElementById('bb-account-hydration-fallback')?.remove();notify('Accounts connected','Your approved trading accounts are ready.','success');}
    catch(e){console.warn('Account hydration remains pending; cached account remains visible:',e);}
   });
   bbStartBackgroundLoops(c);
   c.auth.onAuthStateChange((_event,s)=>{
    session=s||null;window.__bbTerminalAuthSession=session;if(!session?.user){bbShowBootFallback(new Error('Session is reconnecting. Terminal remains open in safe mode; trading is locked until sign-in is restored.'));return;}
    Promise.resolve().then(async()=>{if(session?.access_token&&c.realtime?.setAuth)await c.realtime.setAuth(session.access_token);await accounts();ready=true;renderApp();await refresh(true);}).catch(e=>{console.error('Account refresh failed:',e);notify('Account refresh failed',e.message||'Could not reload trading accounts.','error');});
   });
  }catch(e){bbShowBootFallback(e);}
 })().finally(()=>{startupPromise=null;});
 return startupPromise;
}
window.__bbTerminalRetryStartup=start;
// Fail safe: never leave the client staring at an endless session spinner if startup code stalls.
window.setTimeout(()=>{if(document.documentElement.classList.contains('bb-auth-pending'))bbShowBootFallback(new Error('Secure session is still reconnecting. Terminal layout remains available; trading stays locked until account verification completes.'));},BB_BOOT_TIMEOUT_MS);
// Retry the authenticated handshake after page load in case the Supabase SDK arrived late.
window.addEventListener('load',()=>{if(!session)start().catch(e=>console.warn('Post-load terminal retry:',e));},{once:true});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
