<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BigBull Global Market</title>
<link rel="icon" href="./bigbullsglobal.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--royal:#0B3D91;--sky:#4DA3FF;--muted:#72839a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Inter,Poppins,Montserrat,Arial,sans-serif}
body{background:linear-gradient(180deg,#fff 0%,#fff 66%,#f1f7ff 100%);color:var(--royal)}
#surface{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
#welcome{position:fixed;inset:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:clamp(34px,7vh,66px) 26px max(28px,env(safe-area-inset-bottom));background:linear-gradient(180deg,#fff 0%,#fff 68%,#f2f8ff 100%);overflow:hidden}
.brand-lockup{display:flex;flex-direction:column;align-items:center;gap:13px;z-index:2}
.logo{width:82px;height:82px}
.brand-name{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--royal);text-align:center}
.hero{position:relative;width:100%;flex:1;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.globe{position:absolute;width:min(92vw,390px);height:auto;top:50%;left:50%;transform:translate(-50%,-55%);opacity:.17;pointer-events:none}
h1{position:relative;z-index:1;margin:0 0 13px;font-size:clamp(29px,8vw,38px);line-height:1.15;letter-spacing:-1.1px;font-weight:800;color:var(--royal);max-width:340px}
.tagline{position:relative;z-index:1;margin:0;max-width:290px;font-size:14px;line-height:1.6;color:#71839b}
.bottom{width:100%;max-width:390px;display:flex;flex-direction:column;gap:12px;z-index:2}
.dots{display:flex;justify-content:center;gap:7px;margin:0 0 12px}
.dot{height:6px;width:6px;border-radius:50%;background:#c9d8eb}.dot.active{width:20px;border-radius:9px;background:var(--royal)}
.action{height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:15px;font-weight:700;letter-spacing:.1px;cursor:pointer}
.primary{background:var(--royal);color:#fff;border:1px solid var(--royal);box-shadow:0 3px 9px #0b3d911a}
.secondary{background:#fff;color:var(--royal);border:1px solid #4d83c8}
.action:active{transform:scale(.99)}
@media(min-height:760px){.hero{min-height:330px}.globe{width:min(88vw,430px)}}
</style>
</head>
<body>
<main id="welcome" aria-label="BigBull Global Market welcome">
  <div class="brand-lockup">
    <svg class="logo" viewBox="0 0 100 100" role="img" aria-label="BigBull B horn monogram">
      <path d="M19 27C10 20 8 12 10 6c9 9 17 11 27 10M81 27c9-7 11-15 9-21-9 9-17 11-27 10" fill="none" stroke="#0B3D91" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M27 19h31c19 0 30 10 30 25 0 9-5 16-13 20 11 4 17 12 17 23 0 16-13 25-34 25H27V19zm18 15v22h12c8 0 13-4 13-11s-5-11-13-11H45zm0 37v25h14c9 0 14-4 14-12s-5-13-14-13H45z" transform="translate(0 -8) scale(.88)" fill="#0B3D91"/>
      <path d="M47 10l13 13-13 13" fill="none" stroke="#4DA3FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="brand-name">BIGBULL GLOBAL MARKET</div>
  </div>
  <section class="hero">
    <svg class="globe" viewBox="0 0 420 300" aria-hidden="true">
      <g fill="none" stroke="#4DA3FF" stroke-width="1.5">
        <ellipse cx="210" cy="150" rx="170" ry="112"/><ellipse cx="210" cy="150" rx="82" ry="112"/><ellipse cx="210" cy="150" rx="145" ry="112"/>
        <path d="M43 150h334M62 104h296M62 196h296M210 38v224"/>
        <path d="M64 208l68-26 48 8 55-54 49 10 73-83" stroke="#0B3D91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
    <h1>Trade the World,<br>Smartly</h1>
    <p class="tagline">Stocks, markets and insights, all in one place.</p>
  </section>
  <div class="bottom">
    <div class="dots" aria-hidden="true"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
    <button class="action primary" type="button" onclick="window.bbOpenAuth('signup')">Get Started</button>
    <button class="action secondary" type="button" onclick="window.bbOpenAuth('login')">Log In</button>
  </div>
</main>
<iframe id="surface" title="BigBull Global Market" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js"></script>
</body>
</html>
