name: Validate BIGBULLS client portal

on:
  pull_request:
    paths:
      - "app.js"
      - "v3-portal.js"
      - "index.html"
      - "v3-auth.js"
      - "auth.html"
      - ".github/workflows/validate-trading-terminal.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "app.js"
      - "v3-portal.js"
      - "index.html"
      - ".github/workflows/validate-trading-terminal.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check client portal JavaScript syntax
        run: |
          node --check app.js
          node --check v3-portal.js
          node --check v3-auth.js
