name: BIGBULLS Android APK
on:
  push:
    branches:
      - feature/bigbullsglobal-android-app
    paths:
      - "android-app/**"
      - ".github/workflows/bigbullsglobal-android.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Apply non-breaking dependency security fixes
        run: npm audit fix
        continue-on-error: true
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))'
      - name: Set embedded Android build number
        run: sed -i "s/android-build-46/android-build-${GITHUB_RUN_NUMBER}/g" www/app.js
      - name: Bundle web app and native biometric plugin
        working-directory: android-app
        run: npm run build:web
      - name: Generate BB icon and splash
        run: |
          npm run assets
          npx capacitor-assets generate --android
      - name: Create Android project if needed
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          node patch-native-android.mjs
      - name: Enable Android hardware acceleration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if re.search(r'<application\b[^>]*android:hardwareAccelerated=', s):
              s=re.sub(r'(<application\b[^>]*?)android:hardwareAccelerated="[^"]*"', r'\1android:hardwareAccelerated="true"', s, count=1)
          else:
              s=re.sub(r'<application\b', '<application android:hardwareAccelerated="true"', s, count=1)
          p.write_text(s)
          PY
      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Publish latest public Android APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK_PATH" "android/app/build/outputs/apk/debug/BIGBULLS-Android.apk"
          gh release create "android-build-${GITHUB_RUN_NUMBER}" "android/app/build/outputs/apk/debug/BIGBULLS-Android.apk" \
            --title "BIGBULLS Android Build #${GITHUB_RUN_NUMBER}" \
            --notes "Installable BIGBULLS Android APK. Built from commit ${GITHUB_SHA}. Security dependency audit executed in CI." \
            --latest
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BIGBULLS-Global-Market-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
