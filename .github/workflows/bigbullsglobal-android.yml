name: BIGBULLS Android APK
on:
  push:
    branches:
      - feature/bigbullsglobal-android-app
    paths:
      - "android-app/**"
      - ".github/workflows/bigbullsglobal-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Bundle web app and native biometric plugin
        working-directory: android-app
        run: npm run build:web
      - name: Generate BB icon and splash
        run: |
          npm run assets
          npx capacitor-assets generate --android
      - name: Create Android project if needed
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          node patch-native-android.mjs
      - name: Enable Android hardware acceleration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if re.search(r'<application\b[^>]*android:hardwareAccelerated=', s):
              s=re.sub(r'(<application\b[^>]*?)android:hardwareAccelerated="[^"]*"', r'\1android:hardwareAccelerated="true"', s, count=1)
          else:
              s=re.sub(r'<application\b', '<application android:hardwareAccelerated="true"', s, count=1)
          p.write_text(s)
          PY
      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BIGBULLS-Global-Market-Android-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
