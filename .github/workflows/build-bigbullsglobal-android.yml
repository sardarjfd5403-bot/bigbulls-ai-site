name: Build BigbullsGlobal Android APK
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/bigbullsglobal-android-app
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm install
      - name: Generate BigBull app icon and splash assets
        working-directory: android-app
        run: npm run assets
      - name: Generate Android project
        working-directory: android-app
        run: npx cap add android
      - name: Generate native launcher and splash resources
        working-directory: android-app
        run: npx capacitor-assets generate --android
      - name: Sync Android project
        working-directory: android-app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BigbullsGlobal-test-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
